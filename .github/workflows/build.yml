name: Build tuptup.top Mirror

on:
  push:
    branches: [android, main, master]
  pull_request:
    branches: [android, main, master]

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android cmdline-tools + SDK platform/build-tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle 8.6 distribution
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> "$GITHUB_PATH"
      - name: Point project at SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Restore signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "ERROR: secrets SIGNING_KEY / SIGNING_STORE_PASSWORD 未配置" >&2
            exit 1
          fi
          KS=android/app/tuptup-release.jks
          # SIGNING_KEY 可能是纯 base64（GitHub 官方模板做法），也可能已是二进制；两种都兼容。
          # 判据交给 keytool：解出来的必须能当keystore 打开，否则回退到原始字节。
          restore_ok=0
          if printf '%s' "$SIGNING_KEY" | base64 -d > "$KS" 2>/dev/null && [ -s "$KS" ]; then
            if keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" >/tmp/ks.txt 2>&1; then
              echo "source: base64"; restore_ok=1
            else
              echo "base64 解码结果不是有效 keystore，改用原始字节"
            fi
          fi
          if [ "$restore_ok" -eq 0 ]; then
            printf '%s' "$SIGNING_KEY" > "$KS"
            keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" >/tmp/ks.txt 2>&1 \
              || { echo "ERROR: keystore 打不开（store password 不对或内容不是 JKS/PKCS12）"; cat /tmp/ks.txt; exit 1; }
            echo "source: raw"
          fi
          grep -q 'PrivateKeyEntry' /tmp/ks.txt \
            || { echo "ERROR: keystore 内没有 PrivateKeyEntry，无法用于签名"; cat /tmp/ks.txt; exit 1; }
          # alias 以 keystore 实际内容为准：secret 名给的可能是密码而非 alias
          KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          ALIAS=""
          while IFS= read -r a; do
            [ -n "$a" ] && ALIAS="$a" && break
          done < <(grep 'PrivateKeyEntry' /tmp/ks.txt | awk -F', ' '{print $1}')
          [ -n "$ALIAS" ] || { echo "ERROR: 未能从 keystore 解析出 alias"; cat /tmp/ks.txt; exit 1; }
          echo "keystore ok, alias=$ALIAS"
          {
            echo "storeFile=app/tuptup-release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Assert APK is not signed with the debug key
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          python3 scripts/verify_apk_signature.py "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuptup-mirror-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  wince-build:
    name: Build WinCE receiver (ARM)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build tuptup.exe with CeGCC (arm-mingw32ce, GCC 9.3)
        run: |
          cd wince
          chmod +x build_wince.sh
          ./build_wince.sh
      - name: Verify PE is ARM WinCE
        run: |
          OD=/opt/cegcc-arm/bin/arm-mingw32ce-objdump
          "$OD" -f wince/tuptup.exe | grep -qi "architecture: arm" || { echo "ERROR: not ARM architecture"; exit 1; }
          echo "ARM architecture: OK"
          # 解析 PE 头：machine 在 pe+4，subsystem 在 pe+24+68（Windows CE = 9）
          if command -v od >/dev/null 2>&1; then
            pe=$(od -An -tu4 -j60 -N4 wince/tuptup.exe | tr -d ' ')
            subs=$(od -An -tu2 -j$((pe + 92)) -N2 wince/tuptup.exe | tr -d ' ')
            echo "subsystem=$subs (9 = Windows CE GUI)"
            [ "$subs" = "9" ] || { echo "ERROR: subsystem is not 9 (Windows CE)"; exit 1; }
          else
            echo "od 不可用，仅做软性检查："; "$OD" -p wince/tuptup.exe | grep -i subsystem || true
          fi
          echo "OK: ARM Windows CE PE produced"
      - name: Upload WinCE exe
        uses: actions/upload-artifact@v4
        with:
          name: tuptup-wince-exe
          path: wince/tuptup.exe
      # R27：同时产出「单 USB 共享网络」变体。SD 卡上要与完整版做 A/B 对比：
      # 该变体不含 ADB 隧道，可排除 ADB 模块本身导致真车崩溃的可能。
      - name: Build usbnet-only variant (no ADB)
        run: |
          cd wince
          chmod +x build_wince.sh
          VARIANT=usbnet ./build_wince.sh
      - name: Verify usbnet variant PE
        run: |
          ls -la wince/tuptup-usbnet.exe
          /opt/cegcc-arm/bin/arm-mingw32ce-objdump -f wince/tuptup-usbnet.exe \
            | grep -qi "architecture: arm" || { echo "ERROR: usbnet variant not ARM"; exit 1; }
          echo "usbnet variant: ARM OK"
      - name: Upload usbnet variant
        uses: actions/upload-artifact@v4
        with:
          name: tuptup-wince-usbnet-exe
          path: wince/tuptup-usbnet.exe

  source-check:
    name: Source sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sources present
        run: |
          test -f android/app/build.gradle && echo "android app module OK"
          test -f android/app/src/main/AndroidManifest.xml && echo "manifest OK"
          test -f wince/src/decoder.cpp && echo "wince decoder OK"
          test -f wince/src/nanojpeg.c && echo "nanojpeg vendored OK"
