plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'top.tuptup.mirror'
    compileSdk 34

    defaultConfig {
        applicationId "top.tuptup.mirror"
        minSdk 21           // Android 5.0，MediaProjection 起点
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI 无发布签名密钥：复用 debug keystore 产出可安装 APK（满足手机安装/调试需求）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 纯 Kotlin，无需 external native build；ffmpeg/MediaCodec 均为系统/JAVA 层
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
